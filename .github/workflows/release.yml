name: Build & Release

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: "Release name (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            pyinstaller_args: --noconsole
          - os: macos-latest
            target: universal-apple-darwin  # This covers both Intel and M1/M2/M3
            pyinstaller_args: --windowed
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            pyinstaller_args: ""

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install pyinstaller
          pip install -r backend/requirements.txt

      # ── Build Python sidecar ─────────────────────────────────────────────────
      - name: Build Python sidecar
        working-directory: backend
        run: pyinstaller --onefile --name backend ${{ matrix.pyinstaller_args }} main.py

      - name: Rename, Move, and Sign sidecar
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            mv "backend/dist/backend.exe" "src-tauri/binaries/backend-${{ matrix.target }}.exe"
          else
            mv "backend/dist/backend" "src-tauri/binaries/backend-${{ matrix.target }}"
            # Self-sign the sidecar so macOS doesn't think it's 'damaged'
            if [ "${{ matrix.os }}" == "macos-latest" ]; then
              codesign --force --deep --sign - "src-tauri/binaries/backend-${{ matrix.target }}"
            fi
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Node dependencies
        run: npm install

      # ── Rust setup ───────────────────────────────────────────────────────────
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # Install both architectures for the universal build
          targets: ${{ matrix.os == 'macos-latest' && 'x86_64-apple-darwin,aarch64-apple-darwin' || matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # ── Build Tauri app ───────────────────────────────────────────────────────
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Use ad-hoc signing (-) to satisfy Gatekeeper's basic check
          APPLE_SIGNING_IDENTITY: "-"
        with:
          tagName: ${{ github.event.inputs.release_name }}
          releaseName: "WhatsApp Viewer ${{ github.event.inputs.release_name }}"
          releaseBody: "Download the installer for your platform below."
          releaseDraft: false
          prerelease: false