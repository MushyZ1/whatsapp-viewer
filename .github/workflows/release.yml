name: Build & Release

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: "Release tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows
          - os: windows-latest
            target: x86_64-pc-windows-msvc

          # macOS Intel
          - os: macos-14
            target: x86_64-apple-darwin

          # macOS Apple Silicon
          - os: macos-14
            target: aarch64-apple-darwin

          # Linux
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------
      # Python Setup
      # --------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install pyinstaller
          pip install -r backend/requirements.txt

      - name: Build Python sidecar
        working-directory: backend
        run: |
          pyinstaller --onefile \
            --name backend \
            --hidden-import uvicorn.logging \
            --hidden-import uvicorn.loops.auto \
            --hidden-import uvicorn.protocols.http.auto \
            --hidden-import uvicorn.lifespan.on \
            --hidden-import aiosqlite \
            --collect-all wa_crypt_tools \
            --hidden-import Crypto \
            main.py

      # --------------------
      # Copy sidecar to Tauri
      # --------------------
      - name: Copy sidecar to Tauri binaries
        shell: bash
        run: |
          mkdir -p src-tauri/binaries

          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp backend/dist/backend.exe \
              src-tauri/binaries/backend-${{ matrix.target }}.exe
          else
            cp backend/dist/backend \
              src-tauri/binaries/backend-${{ matrix.target }}
            chmod +x src-tauri/binaries/backend-${{ matrix.target }}
          fi

      # --------------------
      # Node Setup
      # --------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Node dependencies
        run: npm install

      # --------------------
      # Rust Setup
      # --------------------
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # --------------------
      # Linux dependencies
      # --------------------
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      # --------------------
      # Build Tauri App
      # --------------------
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: "-"
        with:
          tagName: ${{ github.event.inputs.release_name }}
          releaseName: "WhatsApp Viewer ${{ github.event.inputs.release_name }}"
          releaseBody: "Download the installer for your platform below."
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
